apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: ops-app2-$env

images:
  - name: ops-app2
    newName: nginx
    newTag: "$TAG"

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: $REPLICAS
    target:
      kind: Deployment
      name: ops-app2

configMapGenerator:
  - name: ops-app2-config
    behavior: merge
    literals:
      - PROFILE=$env
