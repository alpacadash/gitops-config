apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namespace: spring-boot-dev
namePrefix: dev-
# commonLabels:
#   env: dev
labels:
  - pairs:
      app: gitops-dev
      env: dev
    includesSelectors: true
    includesTemplates: true
images:
  - name: gitops-app
    newName: alpacadash/gitops-app
    newTag: latest

replicas:
  - name: gitops-app
    count: 1
